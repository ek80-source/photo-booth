<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#34475a"><link rel="manifest" href="manifest.json"><title>Photo Booth V10</title><style>@font-face{font-family:FestiveSerif;src:url("festive-serif.woff2") format("woff2");font-weight:700;font-display:swap}body{margin:0;background:#181217;color:white;font:18px system-ui;text-align:center}main{max-width:850px;margin:auto;padding:16px}h1{color:#b8e4f4;margin:8px}video,canvas,#animation{width:100%;max-height:65vh;object-fit:contain;background:#30252d;border-radius:12px}button,select,input{font:inherit;padding:12px;margin:5px;border-radius:10px;border:0}button{background:#b8e4f4;color:#142a3a;font-weight:bold}button:disabled{opacity:.45}a{color:#b8e4f4}#count{font-size:clamp(55px,11vw,115px);position:absolute;top:34%;left:0;right:0;text-shadow:0 3px 12px black;pointer-events:none}#mirrorHint{position:absolute;top:5%;left:4%;right:4%;padding:8px;background:rgba(0,0,0,.55);border-radius:10px;font-size:clamp(15px,2vw,25px);pointer-events:none}.preview{position:relative}label{display:inline-block;padding:6px}small{display:block;color:#ddd}[hidden]{display:none!important}#focus{position:fixed;inset:0;z-index:20;background:rgba(18,12,17,.96);display:flex;flex-direction:column;align-items:center;color:white;padding:8px;box-sizing:border-box}#arrow{font-size:75px;color:#b8e4f4;line-height:1;animation:pulse 1.4s ease-in-out infinite}#focusText{font-size:clamp(22px,4vw,38px);color:#b8e4f4}#focusNumber{font-size:clamp(60px,16vh,140px);font-weight:bold;color:white}#hint{font-size:22px}@keyframes pulse{50%{opacity:.55}}@media(prefers-reduced-motion:reduce){#arrow{animation:none}}@media(orientation:landscape){main{max-width:1100px;padding:8px}video,canvas,#animation{max-height:52vh}h1{font-size:24px}button,select{padding:9px}}video.mirror{transform:scaleX(-1)}</style></head><body><main><h1>Photo Booth</h1><p>Photos · GIFs · Boomerangs</p><div class="preview"><video id="video" autoplay playsinline muted></video><canvas id="result" hidden></canvas><img id="animation" hidden alt="Animated photo preview"><div id="count"></div><div id="mirrorHint" hidden>Watch yourself — find your best smile!</div></div><div><button id="start">Enable camera</button><button id="flip">Switch camera</button><label>Countdown <select id="delay"><option>3</option><option selected>5</option><option>10</option><option>0</option></select></label><label>Layout <select id="layout"><option value="1">Single photo</option><option value="3">3-photo collage</option><option value="gif">Animated GIF</option><option value="bounce">Boomerang</option></select></label><label>Filter <select id="filter"><option value="none">Original Color</option><option value="soft" selected>Soft Glam</option><option value="bw">Classic Black &amp; White</option><option value="vintage">Vintage Film</option><option value="pop">Vibrant Color</option><option value="bwsoft">B&amp;W Glamour</option></select></label><label>GIF length <select id="duration"><option>2</option><option selected>3</option><option>5</option></select></label><label>Border <select id="border"><option value="none">No border</option><option value="green">Evergreen &amp; gold</option><option value="red">Cranberry &amp; ivory</option><option value="snow">Winter silver</option><option value="desert">Desert Weave · turquoise &amp; clay</option><option value="sunset">Desert Weave · sunset &amp; cream</option><option value="poster" selected>Southwestern poster border (matching sign)</option></select></label><label>Greeting font <select id="lettering"><option value="festive" selected>Festive serif (accent-safe)</option><option value="classic">Classic sans-serif</option></select></label><label>Greeting <select id="greeting"><option value="">No greeting</option><option>Merry Christmas</option><option>Happy Holidays</option><option>Yá’át’ééh Késhmish</option><option>Nizhónígo Késhmish Da’doołeeł</option><option>S’he:kig Lismas</option><option>Yoos Xumay Nyshnyaash Xotk</option><option>Gozhǫ́ǫ́ Késhmish</option><option value="custom">Custom greeting</option></select></label><input id="custom" maxlength="80" placeholder="Your greeting" hidden><label><input type="checkbox" id="showYear"> Show year</label><label id="yearWrap" hidden>Year <input id="year" type="number" min="1000" max="9999" step="1" value="2026" style="width:90px"></label><label>Countdown guide <select id="guide"><option value="mirror" selected>Mirror Mode — watch yourself</option><option value="lens">Look at camera lens</option><option value="off">No guide</option></select></label><label><input type="checkbox" id="voice" checked> Voice countdown</label><label><input type="checkbox" id="mirror" checked> Mirror front preview</label></div><button id="take" disabled>Take photo</button><button id="retake" hidden>Retake</button><button id="share" hidden>Text / Email / Share</button><button id="save" hidden>Save photo / GIF</button><button id="clear" hidden>Clear for next guest</button><p id="status" role="status">Enable the camera to begin.</p><small>Ask permission before taking or sharing a guest's photo. Sharing opens your Android share menu. Photos are not uploaded by this app.</small></main><div id="focus" hidden role="status"><div id="arrow">↑</div><div id="focusText">LOOK AT THE CAMERA</div><div id="focusNumber"></div><div id="hint">Eyes up and smile!</div></div><script>
const $=id=>document.getElementById(id),v=$('video'),c=$('result');const posterBorder=new Image();posterBorder.src='poster-border.webp';let stream,facing='user',busy=false,blob=null,previewUrl=null;const say=s=>$('status').textContent=s;const wait=ms=>new Promise(r=>setTimeout(r,ms));async function camera(){try{stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=stream;await v.play();updateMirror();$('take').disabled=false;say('Ready!');}catch(e){$('take').disabled=true;say('Camera unavailable. Use HTTPS and allow camera access. '+e.message)}}$('start').onclick=()=>{if(!busy)camera()};$('flip').onclick=()=>{if(busy)return;facing=facing==='user'?'environment':'user';camera()};function updateMirror(){v.classList.toggle('mirror',facing==='user'&&$('mirror').checked)}$('mirror').onchange=updateMirror;function speak(t){if(!$('voice').checked||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=1;speechSynthesis.speak(u)}catch(e){}}function focusOff(){$('focus').hidden=true;$('mirrorHint').hidden=true;$('count').textContent='';}async function countdown(){const n=+$('delay').value,mode=$('guide').value,guide=mode==='lens'&&facing==='user',mirror=mode==='mirror'&&facing==='user';$('focus').hidden=!guide;$('mirrorHint').hidden=!mirror;$('focusText').textContent='LOOK AT THE CAMERA';$('hint').textContent='Eyes up and smile!';$('focusNumber').textContent='';for(let t=n;t>0;t--){if(guide)$('focusNumber').textContent=t;else $('count').textContent=t;if(t===n&&t>3)speak(mirror?'Watch yourself and find your best smile':guide?'Look at the camera and smile':'Get ready and smile');else if(t<=3)speak(String(t));await wait(1000)}$('count').textContent='';$('focusNumber').textContent='';$('mirrorHint').hidden=true;}document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['INPUT','SELECT','BUTTON','TEXTAREA'].includes(document.activeElement?.tagName)&&!$('take').disabled&&!$('take').hidden){e.preventDefault();$('take').click()}});const filters={none:'none',soft:'brightness(1.06) contrast(0.94) saturate(1.03) sepia(0.06)',bw:'grayscale(1) contrast(1.12)',vintage:'sepia(0.23) saturate(0.83) contrast(0.94) brightness(1.04)',pop:'saturate(1.18) contrast(1.04)',bwsoft:'grayscale(1) contrast(0.88) brightness(1.08)'};function updateFilter(){v.style.filter=filters[$('filter').value]}$('filter').onchange=updateFilter;updateFilter();function drawFiltered(x,filter,...args){x.save();x.filter=filter;x.drawImage(v,...args);x.restore()}function controls(done){v.hidden=done;c.hidden=!done;for(const id of ['share','save','retake','clear'])$(id).hidden=!done;$('take').hidden=done;$('start').disabled=done;$('flip').disabled=done;$('filter').disabled=done}function reset(){if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;$('animation').hidden=true;$('animation').removeAttribute('src');blob=null;c.width=c.height=1;controls(false);say('Ready for the next guest.')} $('retake').onclick=reset;$('clear').onclick=reset;$('take').onclick=async()=>{if(busy||!v.videoWidth)return;busy=true;$('filter').disabled=true;const selectedFilter=filters[$('filter').value];$('take').disabled=$('flip').disabled=$('start').disabled=true;for(const id of ['delay','layout','duration','border','greeting','custom','showYear','year','guide','voice','mirror','lettering'])$(id).disabled=true;try{if($('lettering').value==='festive'&&document.fonts)await document.fonts.load('700 40px FestiveSerif');if(['gif','bounce'].includes($('layout').value)){await captureAnimation(selectedFilter);return}let n=+$('layout').value,w=Math.min(v.videoWidth,1600),h=Math.round(w*v.videoHeight/v.videoWidth),banner=footer(w);c.width=w;c.height=h*n+banner;let x=c.getContext('2d');for(let i=0;i<n;i++){await countdown();drawFiltered(x,selectedFilter,0,i*h,w,h);focusOff();if(i<n-1){say('Next photo…');await wait(700)}}decorate(x,w,h*n,banner);blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));controls(true);say('Photo ready. Share it with your guest or save it.')}catch(e){say(e.message)}finally{focusOff();for(const id of ['delay','layout','duration','border','greeting','custom','showYear','year','guide','voice','mirror','lettering'])$(id).disabled=false;busy=false;$('take').disabled=false;if(!v.hidden)$('flip').disabled=$('start').disabled=$('filter').disabled=false;$('count').textContent=''}};function file(){return new File([blob],'PhotoBooth-'+Date.now()+(blob.type==='image/gif'?'.gif':'.jpg'),{type:blob.type})}$('share').onclick=async()=>{if(!blob)return;const f=file();try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});say('Share menu closed. Confirm delivery in your messaging app.')}else say('File sharing is unavailable here. Save the photo and attach it in Messages or Gmail.')}catch(e){if(e.name!=='AbortError')say('Sharing unavailable. Save and attach the photo manually.')}};$('save').onclick=()=>{if(!blob)return;let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=file().name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)};if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

$('greeting').onchange=()=>{$('custom').hidden=$('greeting').value!=='custom'};
function greeting(){return $('greeting').value==='custom'?$('custom').value.trim():$('greeting').value}
$('year').value=new Date().getFullYear();$('showYear').onchange=()=>{$('yearWrap').hidden=!$('showYear').checked};
function selectedYear(){return $('showYear').checked?(/^\d{4}$/.test($('year').value)?$('year').value:String(new Date().getFullYear())):''}
function footer(w){return Math.round(w*(greeting()&&selectedYear() ? .25:greeting()||selectedYear() ? .19:0))}
function diamond(x,cx,cy,r,fill){x.fillStyle=fill;x.beginPath();x.moveTo(cx,cy-r);x.lineTo(cx+r,cy);x.lineTo(cx,cy+r);x.lineTo(cx-r,cy);x.closePath();x.fill()}
function weave(x,w,total,band,base,accent,secondary){const unit=Math.max(10,Math.round(w*.022)),edge=Math.max(9,Math.round(w*.03));x.save();x.fillStyle=base;x.fillRect(0,0,w,edge);x.fillRect(0,total-edge,w,edge);x.fillRect(0,0,edge,total);x.fillRect(w-edge,0,edge,total);for(let i=0;i<Math.ceil(w/(unit*3));i++){let cx=i*unit*3+unit*1.5;for(let cy of [edge*.5,total-edge*.5]){diamond(x,cx,cy,unit*.57,accent);diamond(x,cx,cy,unit*.23,secondary)}}for(let i=0;i<Math.ceil(total/(unit*3));i++){let cy=i*unit*3+unit*1.5;for(let cx of [edge*.5,w-edge*.5]){diamond(x,cx,cy,unit*.57,accent);diamond(x,cx,cy,unit*.23,secondary)}}x.strokeStyle=secondary;x.lineWidth=Math.max(2,unit*.14);x.strokeRect(edge,edge,w-2*edge,total-2*edge);if(band){let y=total-band;const motifY=y+band*.12;x.fillStyle=accent;for(let i=0;i<Math.ceil(w/(unit*2.2));i++){let cx=i*unit*2.2+unit;diamond(x,cx,motifY,unit*.46,accent);diamond(x,cx,motifY,unit*.18,secondary)}x.fillStyle=secondary;x.fillRect(edge,y+band*.23,w-2*edge,Math.max(2,unit*.11))}x.restore()}
function posterFrame(x,w,total,band){const img=posterBorder;if(!img.complete||!img.naturalWidth){weave(x,w,total,band,'#761b22','#fff2d5','#078587');return}const iw=img.naturalWidth,ih=img.naturalHeight,th=Math.max(12,Math.round(w*.065)),side=Math.max(7,Math.round(w*.021));const topH=ih*.065,botY=ih*.935;x.save();x.drawImage(img,0,0,iw,topH,0,0,w,th);x.drawImage(img,0,botY,iw,ih-botY,0,total-th,w,th);if(total>th*2){x.drawImage(img,0,ih*.12,iw*.024,ih*.76,0,th,side,total-th*2);x.drawImage(img,iw*.976,ih*.12,iw*.024,ih*.76,w-side,th,side,total-th*2)}x.strokeStyle='#752023';x.lineWidth=Math.max(2,w*.004);x.strokeRect(side,th,w-2*side,total-2*th);x.restore()}
function decorate(x,w,h,band){const style=$('border').value,msg=greeting(),year=selectedYear(),palettes={green:['#163e30','#e6bd68','#f6ead6'],red:['#85283e','#fff1d7','#e6bd68'],snow:['#29465f','#e6f3ff','#b5c9da'],desert:['#204e50','#e5b980','#bd694b'],sunset:['#8a4439','#f6e4bf','#c99b55'],poster:['#761b22','#fff2d5','#078587'],none:['#34475a','#ffffff','#ffffff']},[base,accent,secondary]=palettes[style];x.save();const t=Math.max(3,Math.round(w*.025)),woven=style==='desert'||style==='sunset';if(band){x.fillStyle=base;x.fillRect(0,h,w,band);x.fillStyle=accent;x.textAlign='center';x.textBaseline='middle';let size=Math.round(w*.062),family=$('lettering').value==='festive'?'FestiveSerif, "DejaVu Serif", serif':'system-ui, sans-serif';do{x.font=`700 ${size}px ${family}`;if(x.measureText(msg).width<=w*.82)break;size--}while(size>8);if(msg)x.fillText(msg,w/2,h+band*(year ? .47 : .60),w*.84);if(year){x.font=`700 ${Math.round(w*.052)}px ${family}`;x.fillText(year,w/2,h+band*(msg ? .78 : .58),w*.84)}}if(style==='poster'){posterFrame(x,w,h+band,band)}else if(woven){weave(x,w,h+band,band,base,accent,secondary)}else if(style!=='none'){x.strokeStyle=base;x.lineWidth=t*2;x.strokeRect(0,0,w,h+band);x.strokeStyle=accent;x.lineWidth=Math.max(1,t*.18);x.strokeRect(t,t,w-2*t,h+band-2*t);for(const [a,b] of [[t*2,t*2],[w-t*2,t*2],[t*2,h+band-t*2],[w-t*2,h+band-t*2]]){x.fillStyle=accent;x.beginPath();for(let i=0;i<8;i++){let r=i%2?t*.35:t*.8,ang=i*Math.PI/4;x.lineTo(a+Math.cos(ang)*r,b+Math.sin(ang)*r)}x.closePath();x.fill()}}x.restore()}

function encodeGif(frames,w,h){const out=[],b=x=>out.push(x&255),word=x=>{b(x);b(x>>8)},str=x=>{for(const c of x)b(c.charCodeAt(0))};str('GIF89a');word(w);word(h);b(247);b(0);b(0);for(let i=0;i<256;i++){if(i>=224){const g=Math.round((i-224)*255/31);b(g);b(g);b(g)}else{b(Math.round((i>>5)*255/6));b(Math.round(((i>>2)&7)*255/7));b((i&3)*85)}}out.push(33,255,11);str('NETSCAPE2.0');out.push(3,1,0,0,0);for(const pixels of frames){out.push(33,249,4,4,13,0,0,0,44);word(0);word(0);word(w);word(h);b(0);b(8);let data=[],acc=0,bits=0;const code=x=>{acc|=x<<bits;bits+=9;while(bits>=8){data.push(acc&255);acc>>=8;bits-=8}};for(let i=0;i<pixels.length;i++){if(i%200===0)code(256);code(pixels[i])}code(257);if(bits)data.push(acc&255);for(let i=0;i<data.length;i+=255){let chunk=data.slice(i,i+255);b(chunk.length);for(const x of chunk)b(x)}b(0)}b(59);return new Blob([new Uint8Array(out)],{type:'image/gif'})}
async function captureAnimation(selectedFilter){const mode=$('layout').value,duration=+$('duration').value;await countdown();if(!$('focus').hidden){$('focusText').textContent='KEEP LOOKING AT THE CAMERA';$('hint').textContent='Smile, wave or strike a pose!';$('focusNumber').textContent='● REC'}const w=Math.min(v.videoWidth,320),h=Math.round(w*v.videoHeight/v.videoWidth),banner=footer(w);c.width=w;c.height=h+banner;const x=c.getContext('2d',{willReadFrequently:true}),frames=[];say('Recording — move or wave!');const start=performance.now();for(let i=0;i<Math.round(duration*8);i++){drawFiltered(x,selectedFilter,0,0,w,h);decorate(x,w,h,banner);const rgba=x.getImageData(0,0,w,h+banner).data,px=new Uint8Array(w*(h+banner));for(let j=0;j<px.length;j++){const r=rgba[j*4],g=rgba[j*4+1],b=rgba[j*4+2];px[j]=Math.max(r,g,b)-Math.min(r,g,b)<=5?224+Math.round((r+g+b)/3*31/255):(Math.round(r*6/255)<<5)|(Math.round(g*7/255)<<2)|Math.round(b*3/255)};frames.push(px);await wait(Math.max(0,start+(i+1)*125-performance.now()))}focusOff();say('Creating GIF…');await wait(30);if(mode==='bounce')frames.push(...frames.slice(1,-1).reverse());blob=encodeGif(frames,w,h+banner);controls(true);c.hidden=true;previewUrl=URL.createObjectURL(blob);$('animation').src=previewUrl;$('animation').hidden=false;say('GIF ready. Share or save it. Email is best for larger GIFs.');}
</script></body></html>
